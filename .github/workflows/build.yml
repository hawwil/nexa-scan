name: Build APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -o source.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile check (debug)
        working-directory: src
        run: gradle assembleDebug --no-daemon

      - name: Decrypt upload key
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEY_PASSWORD" ]; then echo "::error::Add the UPLOAD_KEY_PASSWORD secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in src/upload.jks.enc -out src/upload.jks -pass env:UPLOAD_KEY_PASSWORD

      - name: Build
        working-directory: src
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Rename
        run: |
          cp src/app/build/outputs/apk/release/app-release.apk NEXA-Scan.apk
          cp src/app/build/outputs/bundle/release/app-release.aab NEXA-Scan.aab
          rm -f src/upload.jks

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NEXA Scan ${{ github.run_number }}
          files: |
            NEXA-Scan.apk
            NEXA-Scan.aab
          make_latest: true
